[package]
name = "base64-ng-multibase"
version = "2.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Bounded Base64-family multibase support for base64-ng"
repository = "https://github.com/valkyoth/base64-ng"
homepage = "https://github.com/valkyoth/base64-ng"
documentation = "https://docs.rs/base64-ng-multibase"
readme = "README.md"
keywords = ["base64", "multibase", "multiformats", "encoding"]
categories = ["encoding", "no-std"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "README.md",
]

[features]
default = ["alloc", "std"]
alloc = ["base64-ng/alloc"]
std = ["alloc", "base64-ng/std"]

[dependencies]
base64-ng = { version = "2.0.2", path = "../..", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[package.metadata.docs.rs]
all-features = true
