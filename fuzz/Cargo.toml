[package]
name = "base64-ng-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22.1"
base64-ng = { path = "..", version = "2.0.0", features = ["alloc", "simd", "std", "stream"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "in_place"
path = "fuzz_targets/in_place.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_chunks"
path = "fuzz_targets/stream_chunks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profiles"
path = "fuzz_targets/profiles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x86_encode"
path = "fuzz_targets/x86_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x86_decode"
path = "fuzz_targets/x86_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "neon"
path = "fuzz_targets/neon.rs"
test = false
doc = false
bench = false
