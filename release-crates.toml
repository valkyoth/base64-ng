[release]
version = "2.0.4"
policy = "selective-patch"

[crates."base64-ng"]
previous_version = "2.0.3"
version = "2.0.4"
change = "metadata"
publish = true
reason = "Advances the family entry point for the sanitization 2.1.0 integration and current immutable GitHub Actions while retaining Rust 1.98.1 release checks."

