[package]
name = "base64-ng"
version = "2.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "no_std-first Base64 encoding and decoding with strict RFC 4648 APIs and optional SIMD"
repository = "https://github.com/valkyoth/base64-ng"
homepage = "https://github.com/valkyoth/base64-ng"
documentation = "https://docs.rs/base64-ng"
readme = "README.md"
keywords = ["base64", "encoding", "no-std", "simd"]
categories = ["encoding", "no-std"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "/README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "/LICENSE-*",
]

[workspace]
members = [
    ".",
    "crates/base64-ng-bytes",
    "crates/base64-ng-derive",
    "crates/base64-ng-imap",
    "crates/base64-ng-mime",
    "crates/base64-ng-multibase",
    "crates/base64-ng-password",
    "crates/base64-ng-openpgp",
    "crates/base64-ng-pem",
    "crates/base64-ng-sanitization",
    "crates/base64-ng-serde",
    "crates/base64-ng-subtle",
    "crates/base64-ng-tokio",
]
default-members = ["."]
exclude = [
    "dudect",
    "fuzz",
    "perf",
    "protocol-registry/runner",
    "semantic-corpus/runner",
]
resolver = "2"

[features]
default = ["alloc", "std"]
alloc = []
std = ["alloc"]
simd = []
stream = ["std"]
# Broad best-effort secret storage, scalar processing, and cleanup capability.
# This does not attest protected memory or platform high-assurance posture.
secrets = []
# Redundant ordinary backend verification with bounded stack staging,
# quarantine, and scalar retry. It intentionally implies SIMD.
checked-backend = ["simd"]
# Secret-only deployment acknowledgements. They are no-ops for ordinary
# public-data builds and intentionally do not imply high assurance.
allow-wasm32-best-effort-wipe = []
allow-compiler-fence-only-wipe = []
# Placeholder for future async Tokio integration; currently no-op,
# dependency-free, and enforced by scripts/check_reserved_features.sh.
tokio = []
kani = []
fuzzing = []

[dependencies]

[dev-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(base64_ng_aarch64_csdb_attested)",
    "cfg(base64_ng_perf_evidence)",
    "cfg(base64_ng_require_high_assurance)",
    "cfg(base64_ng_rvv_candidate)",
    "cfg(base64_ng_sve_candidate)",
    "cfg(base64_ng_kani_advanced)",
    "cfg(kani)",
    "cfg(miri)",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
