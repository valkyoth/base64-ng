name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE64_NG_REQUIRE_OPENPGP_INTEROP: "1"
      GPG: /usr/bin/gpg
      SQ: /usr/bin/sq

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install OpenPGP interoperability tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gnupg sq
          /usr/bin/gpg --version
          /usr/bin/sq packet dearmor --help >/dev/null

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install security and test tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit@0.22.2,cargo-nextest@0.9.140
          fallback: none

      - name: Install crates.io release tools
        run: |
          rustup toolchain install nightly-2026-07-13 --profile minimal
          cargo install --locked cargo-public-api --version 0.52.0
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-license --version 0.7.0
          cargo install --locked cargo-sbom --version 0.10.0

      - name: Install targets required by the complete check suite
        run: rustup target add aarch64-unknown-linux-gnu wasm32-unknown-unknown

      - name: Run checks
        run: scripts/checks.sh

      - name: Run nextest
        run: cargo nextest run --all-features

      - name: Check fuzz-only dependencies
        run: scripts/check_fuzz.sh

      - name: Check performance harness dependencies
        run: scripts/check_perf.sh

      - name: Check dudect timing harness dependencies
        run: scripts/check_dudect.sh

      - name: Generate constant-time assembly evidence
        run: scripts/generate_ct_asm_evidence.sh

      - name: Generate SBOM
        run: scripts/generate-sbom.sh

      - name: Reproducible package/build check
        run: scripts/reproducible_build_check.sh

      - name: Check SIMD feature bundles
        run: scripts/check_simd_feature_bundles.sh

  rust-version-compat:
    name: Rust compatibility (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.90.0
          - 1.91.0
          - 1.92.0
          - 1.93.0
          - 1.94.0
          - 1.95.0
          - 1.96.0
          - 1.96.1
          - 1.97.0
          - 1.97.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: rust-${{ matrix.toolchain }}

      - name: Check all features
        run: cargo +${{ matrix.toolchain }} check --all-features

      - name: Check no-default-features library
        run: cargo +${{ matrix.toolchain }} check --no-default-features --lib

      - name: Check complete 2.0 MSRV host matrix
        if: matrix.toolchain == '1.90.0'
        run: scripts/check-2.0-msrv.sh --host

  msrv-target-build:
    name: Rust 1.90 target contract (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-freebsd
          - wasm32-unknown-unknown
          - thumbv7em-none-eabihf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.90 target
        run: |
          rustup toolchain install 1.90.0
          rustup target add --toolchain 1.90.0 ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          key: msrv-target-${{ matrix.target }}

      - name: Check 2.0 MSRV target contract
        run: scripts/check-2.0-msrv.sh --target ${{ matrix.target }}

  platform:
    name: Platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15
          - macos-26
          - macos-15-intel
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Run macOS verification
        if: startsWith(matrix.os, 'macos')
        run: scripts/check_macos.sh

      - name: Test default features
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: cargo test --all-targets

      - name: Test all features
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: cargo test --all-targets --all-features

      - name: Check no_std library build
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: cargo check --no-default-features --lib

      - name: Test no default features
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: cargo test --no-default-features --all-targets

  target-build:
    name: no_std target build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-freebsd
          - wasm32-unknown-unknown
          - thumbv7em-none-eabihf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Check no_std simd-reserved build
        run: scripts/check_targets.sh ${{ matrix.target }}

      - name: Check no-alloc portability smoke
        run: scripts/check_no_alloc_smoke.sh ${{ matrix.target }}

  big-endian-qemu:
    name: Big-endian QEMU functional evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install big-endian Rust targets
        run: rustup target add s390x-unknown-linux-gnu powerpc64-unknown-linux-gnu

      - name: Install QEMU and cross libc toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            qemu-user \
            gcc-s390x-linux-gnu libc6-dev-s390x-cross \
            gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross

      - name: Run both complete big-endian suites
        run: scripts/check_big_endian_qemu.sh --all

  riscv-qemu:
    name: RISC-V QEMU and RVV candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install RISC-V Rust target
        run: rustup target add riscv64gc-unknown-linux-gnu

      - name: Install QEMU and RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            qemu-user \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            binutils-riscv64-linux-gnu

      - name: Run scalar and RVV candidate suites
        run: scripts/check_riscv_qemu.sh

      - name: Generate RVV candidate assembly evidence
        run: scripts/generate_rvv_asm_evidence.sh

  sve-qemu:
    name: AArch64 SVE QEMU candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install static AArch64 Rust target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Install QEMU user-mode runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            qemu-user \
            binutils-aarch64-linux-gnu

      - name: Run scalar, NEON, and SVE candidate suites
        run: scripts/check_sve_qemu.sh

      - name: Generate SVE candidate assembly evidence
        run: scripts/generate_sve_asm_evidence.sh

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup

      - name: Run Miri tests
        run: scripts/check_miri.sh

  in-place-sanitizers:
    name: In-place AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci_install_rust.sh

      - name: Install nightly sanitizer support
        run: rustup toolchain install nightly --component rust-src

      - name: Run in-place sanitizer suite
        run: scripts/check-2.0-in-place-sanitizers.sh
