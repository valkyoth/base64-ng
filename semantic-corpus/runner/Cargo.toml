[package]
name = "base64-ng-semantic-corpus-runner"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64-ng = { version = "=2.0.0", path = "../..", features = ["alloc", "std", "stream"] }
base64-ng-bytes = { version = "=2.0.0", path = "../../crates/base64-ng-bytes" }
base64-ng-sanitization = { version = "=2.0.0", path = "../../crates/base64-ng-sanitization", features = ["alloc"] }
base64-ng-serde = { version = "=2.0.0", path = "../../crates/base64-ng-serde" }
base64-ng-tokio = { version = "=2.0.0", path = "../../crates/base64-ng-tokio" }
bytes = "=1.12.1"
serde_json = "=1.0.150"
tokio = { version = "=1.53.1", features = ["io-util", "rt"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
