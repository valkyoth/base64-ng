[package]
name = "base64-ng-perf"
version = "0.0.0"
edition = "2024"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(base64_ng_rvv_candidate)'] }

[workspace]

[features]
default = ["simd"]
simd = ["base64-ng/simd"]

[dependencies]
base64 = "=0.23.0"
base64ct = "=1.8.3"
base64-ng = { path = "..", version = "2.1.0", default-features = false, features = ["alloc", "std", "stream"] }
